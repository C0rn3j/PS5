name: Generate Payload Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "links.txt"
      - "generate.py"
      - ".github/workflows/generate.yaml"
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Generate payload catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 generate.py

      - name: Commit payload catalog
        run: |
          set -euo pipefail

          if git diff --quiet -- payloads.json; then
            echo "payloads.json unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def modules(entries):
              result = {}
              for entry in entries:
                  if entry["filename"].lower().endswith(".elf"):
                      key = (entry["source"], entry["name"])
                      result.setdefault(key, []).append(entry)
              return result

          previous = modules(json.loads(subprocess.check_output(
              ["git", "show", "HEAD:payloads.json"], text=True
          )))
          current = modules(json.loads(Path("payloads.json").read_text()))
          names = set()
          details = []
          for (source, name), entries in sorted(current.items()):
              old = previous.get((source, name), [])
              # Ignore catalog ordering when comparing a module's assets.
              canonical = lambda items: sorted(json.dumps(item, sort_keys=True) for item in items)
              if canonical(old) == canonical(entries):
                  continue
              names.add(name)
              versions = lambda items: ", ".join(sorted({item["version"] for item in items}))
              action = "Updated" if old else "Added"
              change = f"{versions(old)} -> {versions(entries)}" if old else versions(entries)
              details.append(f"{action} {name}: {change}\nSource: {source}")
              details.extend(
                  f"  - {entry['filename']}: {entry['version']}"
                  for entry in sorted(entries, key=lambda item: item["filename"])
              )
              details.append("")

          subject = "chore: Update payload catalog"
          if names:
              subject += ": " + ", ".join(sorted(names, key=str.casefold))
          message = subject + "\n"
          if details:
              message += "\n" + "\n".join(details)
          Path(os.environ["RUNNER_TEMP"], "payload-commit-message.txt").write_text(message)
          PY

          git add payloads.json
          git commit --cleanup=verbatim -F "$RUNNER_TEMP/payload-commit-message.txt"
          git push
